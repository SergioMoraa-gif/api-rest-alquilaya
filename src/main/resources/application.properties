spring.application.name=alquilaya

# Lee las credenciales del archivo .env (no se sube a GitHub)
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alquilaya?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

app.admin.email=admin@alquilaya.com
app.admin.password=Admin1234

app.operador.email=operador@alquilaya.com
app.operador.password=Operador123