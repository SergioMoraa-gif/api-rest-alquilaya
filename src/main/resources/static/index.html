<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlquilaYa - Panel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Pantalla de inicio de sesión -->
    <section id="pantallaLogin" class="login">
        <form id="formLogin" class="tarjeta login-tarjeta">
            <h1>AlquilaYa</h1>
            <p class="subtitulo">Alquiler de vehículos</p>
            <label>Correo
                <input type="email" id="loginEmail" value="admin@alquilaya.com" required>
            </label>
            <label>Contraseña
                <input type="password" id="loginPassword" required>
            </label>
            <button type="submit">Entrar</button>
            <p id="loginError" class="error"></p>
        </form>
    </section>

    <!-- Panel principal -->
    <section id="pantallaPanel" class="oculto">
        <header class="barra">
            <h1>AlquilaYa</h1>
            <nav>
                <button class="tab activa" data-tab="vehiculos">Vehículos</button>
                <button class="tab" data-tab="clientes">Clientes</button>
                <button class="tab" data-tab="alquileres">Alquileres</button>
                <button class="tab" data-tab="oficinas">Oficinas</button>
            </nav>
            <div class="usuario">
                <span id="usuarioActual"></span>
                <button id="btnSalir" class="secundario">Salir</button>
            </div>
        </header>

        <p id="mensaje" class="mensaje oculto"></p>

        <main>
            <!-- VEHÍCULOS -->
            <div id="tab-vehiculos" class="contenido">
                <form id="formVehiculo" class="tarjeta formulario">
                    <h2>Nuevo vehículo</h2>
                    <input name="marca" placeholder="Marca" required>
                    <input name="modelo" placeholder="Modelo" required>
                    <input name="anio" type="number" placeholder="Año" required>
                    <input name="matricula" placeholder="Matrícula" required>
                    <input name="tarifaDiaria" type="number" step="0.01" placeholder="Tarifa diaria" required>
                    <select name="estado">
                        <option value="DISPONIBLE">DISPONIBLE</option>
                        <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                    </select>
                    <button type="submit">Guardar</button>
                </form>
                <div class="tarjeta">
                    <div class="encabezado-tabla">
                        <h2>Vehículos</h2>
                        <select id="filtroEstado">
                            <option value="">Todos</option>
                            <option value="DISPONIBLE">Disponibles</option>
                            <option value="ALQUILADO">Alquilados</option>
                            <option value="MANTENIMIENTO">Mantenimiento</option>
                        </select>
                    </div>
                    <table>
                        <thead><tr><th>ID</th><th>Marca</th><th>Modelo</th><th>Año</th><th>Matrícula</th><th>Tarifa</th><th>Estado</th><th></th></tr></thead>
                        <tbody id="tablaVehiculos"></tbody>
                    </table>
                </div>
            </div>

            <!-- CLIENTES -->
            <div id="tab-clientes" class="contenido oculto">
                <form id="formCliente" class="tarjeta formulario">
                    <h2>Nuevo cliente</h2>
                    <input name="nombre" placeholder="Nombre" required>
                    <input name="apellido" placeholder="Apellido" required>
                    <input name="email" type="email" placeholder="Correo" required>
                    <input name="licenciaConducir" placeholder="Licencia de conducir" required>
                    <input name="telefono" placeholder="Teléfono">
                    <button type="submit">Guardar</button>
                </form>
                <div class="tarjeta">
                    <h2>Clientes</h2>
                    <table>
                        <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Licencia</th><th>Teléfono</th><th></th></tr></thead>
                        <tbody id="tablaClientes"></tbody>
                    </table>
                </div>
            </div>

            <!-- ALQUILERES -->
            <div id="tab-alquileres" class="contenido oculto">
                <form id="formAlquiler" class="tarjeta formulario">
                    <h2>Nuevo alquiler</h2>
                    <label>Cliente <select name="idCliente" id="selectCliente" required></select></label>
                    <label>Vehículo disponible <select name="idVehiculo" id="selectVehiculo" required></select></label>
                    <label>Fecha de alquiler <input name="fechaAlquiler" type="date" required></label>
                    <label>Fecha de devolución <input name="fechaDevolucion" type="date" required></label>
                    <button type="submit">Registrar</button>
                </form>
                <div class="tarjeta">
                    <h2>Alquileres</h2>
                    <table>
                        <thead><tr><th>ID</th><th>Cliente</th><th>Vehículo</th><th>Desde</th><th>Hasta</th><th>Total</th><th>Estado vehículo</th><th></th></tr></thead>
                        <tbody id="tablaAlquileres"></tbody>
                    </table>
                </div>
            </div>

            <!-- OFICINAS -->
            <div id="tab-oficinas" class="contenido oculto">
                <form id="formOficina" class="tarjeta formulario">
                    <h2>Nueva oficina</h2>
                    <input name="nombre" placeholder="Nombre" required>
                    <input name="direccion" placeholder="Dirección" required>
                    <input name="ciudad" placeholder="Ciudad" required>
                    <input name="region" placeholder="Región" required>
                    <button type="submit">Guardar</button>
                </form>
                <div class="tarjeta">
                    <h2>Oficinas</h2>
                    <table>
                        <thead><tr><th>ID</th><th>Nombre</th><th>Dirección</th><th>Ciudad</th><th>Región</th><th></th></tr></thead>
                        <tbody id="tablaOficinas"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
